<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSC Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F2;
    --surface:#FFFFFF;
    --ink:#1C1B19;
    --ink-soft:#726E66;
    --ink-faint:#A7A297;
    --border:#E4E1D9;
    --red:#D64545;
    --red-dim:#F4D6D3;
    --amber:#E8A33D;
    --amber-dim:#F7E4C6;
    --green:#3A945D;
    --green-dim:#D6E9DA;
    --unrated:#D9D6CD;
    --unrated-dim:#EFEDE7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
  }
  .app{
    max-width:920px;
    margin:0 auto;
    padding:0 0 80px;
  }
  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    padding:20px 20px 0;
    border-bottom:1px solid var(--border);
  }
  .header-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .title-block h1{
    font-size:22px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .title-block .sub{
    color:var(--ink-soft);
    font-size:13px;
    margin-top:2px;
  }
  .overall-pct{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1;
    text-align:right;
    white-space:nowrap;
  }
  .overall-pct span{
    display:block;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
    margin-top:3px;
  }
  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:16px 0 12px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{border-color:var(--ink-faint);}
  .tab-btn.active{
    background:var(--ink);
    color:var(--surface);
    border-color:var(--ink);
  }

  main{padding:20px;}

  /* ---------- Overview cards ---------- */
  .overview-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .subject-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .subject-card:hover{border-color:var(--ink-faint);}
  .subject-card:active{transform:scale(0.995);}
  .subject-card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .subject-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:16px;
  }
  .subject-count{
    font-size:12px;
    color:var(--ink-soft);
  }
  .segbar{
    display:flex;
    height:8px;
    border-radius:5px;
    overflow:hidden;
    background:var(--unrated-dim);
  }
  .segbar .seg{height:100%;}
  .seg-red{background:var(--red);}
  .seg-amber{background:var(--amber);}
  .seg-green{background:var(--green);}
  .legend-row{
    display:flex;
    gap:14px;
    margin-top:10px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend-item{display:flex;align-items:center;gap:5px;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot-red{background:var(--red);}
  .dot-amber{background:var(--amber);}
  .dot-green{background:var(--green);}
  .dot-grey{background:var(--unrated);}

  /* ---------- Subject detail ---------- */
  .detail-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .detail-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;
    font-weight:600;
  }
  .filter-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .filter-chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:12px;
    padding:5px 10px;
    border-radius:14px;
    cursor:pointer;
  }
  .filter-chip.active{
    background:var(--ink);
    color:var(--surface);
    border-color:var(--ink);
  }

  .category-group{margin-bottom:22px;}
  .category-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .category-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
  }
  .category-meta{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chevron{
    transition:transform .15s ease;
    color:var(--ink-faint);
  }
  .category-group.collapsed .chevron{transform:rotate(-90deg);}
  .category-body{
    display:flex;
    flex-direction:column;
  }
  .category-group.collapsed .category-body{display:none;}

  .item-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
  }
  .item-row:last-child{border-bottom:none;}
  .item-text{flex:1;min-width:0;}
  .item-sub{
    font-size:11px;
    color:var(--ink-faint);
    text-transform:none;
    margin-bottom:2px;
  }
  .item-point{
    font-size:14px;
    line-height:1.45;
  }
  .item-notes-toggle{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:11px;
    cursor:pointer;
    padding:0;
    margin-top:6px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .item-notes{
    display:none;
    margin-top:8px;
  }
  .item-notes.open{display:block;}
  .item-notes textarea{
    width:100%;
    min-height:50px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    background:var(--bg);
    color:var(--ink);
  }
  .item-notes textarea:focus{
    outline:none;
    border-color:var(--ink-faint);
  }

  /* Traffic light control */
  .signal{
    flex:none;
    display:flex;
    flex-direction:column;
    gap:4px;
    background:#2A2823;
    padding:6px 5px;
    border-radius:9px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  }
  .light{
    width:18px;
    height:18px;
    border-radius:50%;
    cursor:pointer;
    border:none;
    padding:0;
    background:#484540;
    transition:background .12s ease, box-shadow .12s ease, transform .08s ease;
  }
  .light:active{transform:scale(0.9);}
  .light.red.on{background:var(--red);box-shadow:0 0 8px 1px rgba(214,69,69,.7);}
  .light.amber.on{background:var(--amber);box-shadow:0 0 8px 1px rgba(232,163,61,.7);}
  .light.green.on{background:var(--green);box-shadow:0 0 8px 1px rgba(58,148,93,.7);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }

  footer.reset-row{
    display:flex;
    justify-content:flex-end;
    margin-top:24px;
  }
  .reset-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--ink-faint);
    font-size:12px;
    padding:6px 12px;
    border-radius:14px;
    cursor:pointer;
  }
  .reset-btn:hover{border-color:var(--red);color:var(--red);}

  @media (max-width:520px){
    .overall-pct{font-size:24px;}
    header{padding:16px 16px 0;}
    main{padding:16px;}
    .item-point{font-size:13.5px;}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="header-row">
      <div class="title-block">
        <h1>HSC Tracker</h1>
        <div class="sub">Dev's Year 12 syllabus tracker</div>
      </div>
      <div class="overall-pct" id="overallPct">0%<span>confident</span></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

const SUBJECT_ORDER = Object.keys(SUBJECT_DATA);
let currentTab = "overview";
let collapsedCategories = {};
let activeFilters = {};

let statusStore = {};
let loaded = false;

function itemId(subject, idx){ return subject + "::" + idx; }

async function loadStatus(){
  try{
    const res = await window.storage.get('hsc-status', false);
    if(res && res.value){
      statusStore = JSON.parse(res.value);
    }
  }catch(e){
    statusStore = {};
  }
  loaded = true;
  render();
}

async function saveStatus(){
  try{
    await window.storage.set('hsc-status', JSON.stringify(statusStore), false);
  }catch(e){
    console.error('save failed', e);
  }
}

function getStatus(subject, idx){
  const rec = statusStore[itemId(subject, idx)];
  return rec ? rec.status : null;
}
function getNotes(subject, idx){
  const rec = statusStore[itemId(subject, idx)];
  return rec ? (rec.notes || '') : '';
}
function setStatus(subject, idx, status){
  const id = itemId(subject, idx);
  const existing = statusStore[id] || {};
  const newStatus = existing.status === status ? null : status;
  statusStore[id] = { status: newStatus, notes: existing.notes || '' };
  saveStatus();
}
function setNotes(subject, idx, notes){
  const id = itemId(subject, idx);
  const existing = statusStore[id] || {};
  statusStore[id] = { status: existing.status || null, notes };
  saveStatus();
}

function countsFor(subject){
  const items = SUBJECT_DATA[subject];
  const c = { red:0, amber:0, green:0, unrated:0, total: items.length };
  items.forEach((it, idx) => {
    const s = getStatus(subject, idx);
    if(s === 'red') c.red++;
    else if(s === 'amber') c.amber++;
    else if(s === 'green') c.green++;
    else c.unrated++;
  });
  return c;
}

function overallCounts(){
  const c = { red:0, amber:0, green:0, unrated:0, total:0 };
  SUBJECT_ORDER.forEach(subj => {
    const sc = countsFor(subj);
    c.red += sc.red; c.amber += sc.amber; c.green += sc.green; c.unrated += sc.unrated; c.total += sc.total;
  });
  return c;
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  const tabs = [{key:'overview', label:'Overview'}].concat(
    SUBJECT_ORDER.map(s => ({key:s, label:s}))
  );
  tabsEl.innerHTML = tabs.map(t =>
    `<button class="tab-btn ${currentTab===t.key?'active':''}" data-tab="${t.key}">${t.label}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      render();
    });
  });
}

function renderOverallPct(){
  const c = overallCounts();
  const pct = c.total ? Math.round((c.green / c.total) * 100) : 0;
  document.getElementById('overallPct').innerHTML = pct + '%<span>confident</span>';
}

function renderOverview(){
  const main = document.getElementById('main');
  let html = '<div class="overview-list">';
  SUBJECT_ORDER.forEach(subj => {
    const c = countsFor(subj);
    const pctRed = (c.red / c.total) * 100;
    const pctAmber = (c.amber / c.total) * 100;
    const pctGreen = (c.green / c.total) * 100;
    html += `
      <div class="subject-card" data-subject="${subj}">
        <div class="subject-card-top">
          <div class="subject-name">${subj}</div>
          <div class="subject-count">${c.green}/${c.total} confident</div>
        </div>
        <div class="segbar">
          <div class="seg seg-green" style="width:${pctGreen}%"></div>
          <div class="seg seg-amber" style="width:${pctAmber}%"></div>
          <div class="seg seg-red" style="width:${pctRed}%"></div>
        </div>
        <div class="legend-row">
          <div class="legend-item"><span class="dot dot-red"></span>${c.red} struggling</div>
          <div class="legend-item"><span class="dot dot-amber"></span>${c.amber} getting there</div>
          <div class="legend-item"><span class="dot dot-green"></span>${c.green} confident</div>
          <div class="legend-item"><span class="dot dot-grey"></span>${c.unrated} not rated</div>
        </div>
      </div>
    `;
  });
  html += '</div>';
  main.innerHTML = html;
  main.querySelectorAll('.subject-card').forEach(card => {
    card.addEventListener('click', () => {
      currentTab = card.dataset.subject;
      render();
    });
  });
}

function renderSubject(subject){
  const main = document.getElementById('main');
  const items = SUBJECT_DATA[subject];
  const c = countsFor(subject);

  // group by category preserving order
  const categories = [];
  const catMap = {};
  items.forEach((it, idx) => {
    if(!catMap[it.c]){
      catMap[it.c] = { name: it.c, items: [] };
      categories.push(catMap[it.c]);
    }
    catMap[it.c].items.push({ ...it, idx });
  });

  const filterKey = subject;
  const activeFilter = activeFilters[filterKey] || 'all';

  let html = `
    <div class="detail-header">
      <div class="detail-title">${subject}</div>
      <div class="subject-count">${c.green}/${c.total} confident &middot; ${c.red} red &middot; ${c.amber} amber</div>
    </div>
    <div class="filter-row">
      <button class="filter-chip ${activeFilter==='all'?'active':''}" data-filter="all">All</button>
      <button class="filter-chip ${activeFilter==='red'?'active':''}" data-filter="red">Red</button>
      <button class="filter-chip ${activeFilter==='amber'?'active':''}" data-filter="amber">Amber</button>
      <button class="filter-chip ${activeFilter==='green'?'active':''}" data-filter="green">Green</button>
      <button class="filter-chip ${activeFilter==='unrated'?'active':''}" data-filter="unrated">Not rated</button>
    </div>
  `;

  categories.forEach((cat, catIdx) => {
    const visibleItems = cat.items.filter(it => {
      if(activeFilter === 'all') return true;
      const s = getStatus(subject, it.idx) || 'unrated';
      return s === activeFilter;
    });
    if(visibleItems.length === 0) return;

    const collapseKey = subject + '::' + cat.name;
    const isCollapsed = !!collapsedCategories[collapseKey];
    const catGreen = cat.items.filter(it => getStatus(subject, it.idx) === 'green').length;

    html += `<div class="category-group ${isCollapsed?'collapsed':''}" data-collapse-key="${collapseKey}">
      <div class="category-head">
        <div class="category-title">${escapeHtml(cat.name)}</div>
        <div class="category-meta">${catGreen}/${cat.items.length}<span class="chevron">&#9662;</span></div>
      </div>
      <div class="category-body">`;

    visibleItems.forEach(it => {
      const status = getStatus(subject, it.idx);
      const notes = getNotes(subject, it.idx);
      const notesId = `notes-${subject}-${it.idx}`.replace(/[^a-zA-Z0-9-]/g,'_');
      html += `
        <div class="item-row">
          <div class="item-text">
            <div class="item-sub">${escapeHtml(it.sc)}</div>
            <div class="item-point">${escapeHtml(it.p)}</div>
            <button class="item-notes-toggle" data-notes-toggle="${notesId}">${notes ? 'Edit note' : '+ Add note'}</button>
            <div class="item-notes ${notes ? 'open':''}" id="${notesId}">
              <textarea placeholder="Notes..." data-subject="${subject}" data-idx="${it.idx}">${escapeHtml(notes)}</textarea>
            </div>
          </div>
          <div class="signal" data-subject="${subject}" data-idx="${it.idx}">
            <button class="light red ${status==='red'?'on':''}" data-status="red" title="Struggling"></button>
            <button class="light amber ${status==='amber'?'on':''}" data-status="amber" title="Getting there"></button>
            <button class="light green ${status==='green'?'on':''}" data-status="green" title="Confident"></button>
          </div>
        </div>
      `;
    });

    html += `</div></div>`;
  });

  main.innerHTML = html;

  // wire filter chips
  main.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilters[filterKey] = chip.dataset.filter;
      render();
    });
  });

  // wire category collapse
  main.querySelectorAll('.category-head').forEach(head => {
    head.addEventListener('click', () => {
      const group = head.closest('.category-group');
      const key = group.dataset.collapseKey;
      collapsedCategories[key] = !collapsedCategories[key];
      render();
    });
  });

  // wire lights
  main.querySelectorAll('.signal').forEach(sig => {
    sig.querySelectorAll('.light').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const subj = sig.dataset.subject;
        const idx = parseInt(sig.dataset.idx, 10);
        setStatus(subj, idx, btn.dataset.status);
        render();
      });
    });
  });

  // wire notes toggles
  main.querySelectorAll('.item-notes-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.notesToggle);
      target.classList.toggle('open');
      if(target.classList.contains('open')){
        const ta = target.querySelector('textarea');
        if(ta) ta.focus();
      }
    });
  });

  // wire notes textareas
  main.querySelectorAll('.item-notes textarea').forEach(ta => {
    ta.addEventListener('blur', () => {
      setNotes(ta.dataset.subject, parseInt(ta.dataset.idx,10), ta.value);
    });
  });
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  if(!loaded){
    document.getElementById('main').innerHTML = '<div class="empty-state">Loading your progress...</div>';
    return;
  }
  renderTabs();
  renderOverallPct();
  if(currentTab === 'overview'){
    renderOverview();
  } else {
    renderSubject(currentTab);
  }
}

loadStatus();
</script>
</body>
</html>
